<html lang="it">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#C2185B">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="robots" content="noindex,nofollow">

<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">

<style>
:root{
  --paper:#FBF8F9; --surface:#FFFFFF; --surface-2:#F5EFF2;
  --ink:#1C151A; --ink-soft:#6B5F66; --ink-faint:#9A8D94;
  --line:#E8DEE3; --line-strong:#D6C7CE;
  --accent:#C2185B; --accent-ink:#FFFFFF; --accent-soft:#FCEEF4;
  --hip:#C2185B; --hip-soft:#FCEEF4;
  --knee:#5B6B7C; --knee-soft:#EEF1F4;
  --warn:#9A6508; --warn-soft:#FCF3E2;
  --danger:#AC2A20; --danger-soft:#FBEDEB;
  --ok:#2F6B4F; --ok-soft:#EAF3EE;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151015; --surface:#1E181D; --surface-2:#271F26;
  --ink:#F3EBEF; --ink-soft:#AC9DA6; --ink-faint:#7E7078;
  --line:#332932; --line-strong:#473A44;
  --accent:#FF6E9F; --accent-ink:#2A0D18; --accent-soft:#391B29;
  --hip:#FF6E9F; --hip-soft:#391B29;
  --knee:#95A6B8; --knee-soft:#242C34;
  --warn:#E3B463; --warn-soft:#352A17;
  --danger:#FF8D82; --danger-soft:#3A1F1C;
  --ok:#7FC7A1; --ok-soft:#1C2F26;
}}
:root[data-theme="dark"]{
  --paper:#151015; --surface:#1E181D; --surface-2:#271F26;
  --ink:#F3EBEF; --ink-soft:#AC9DA6; --ink-faint:#7E7078;
  --line:#332932; --line-strong:#473A44;
  --accent:#FF6E9F; --accent-ink:#2A0D18; --accent-soft:#391B29;
  --hip:#FF6E9F; --hip-soft:#391B29;
  --knee:#95A6B8; --knee-soft:#242C34;
  --warn:#E3B463; --warn-soft:#352A17;
  --danger:#FF8D82; --danger-soft:#3A1F1C;
  --ok:#7FC7A1; --ok-soft:#1C2F26;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper); color:var(--ink); margin:0;
  font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px; line-height:1.55; padding-bottom:96px;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Source Sans 3",sans-serif;margin:0;letter-spacing:-.015em}
p{margin:0 0 12px;max-width:62ch}
p:last-child{margin-bottom:0}

.hd{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);padding:16px 18px 13px;
}
.hd h1{font-size:24px;font-weight:800;line-height:1.1}
.hd .sub{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);
  letter-spacing:.07em;text-transform:uppercase;margin-top:5px
}
.wrap{max-width:660px;margin:0 auto;padding:18px 18px 28px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:13px}
.lbl{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:9px
}
.muted{color:var(--ink-soft);font-size:14.5px}
.tiny{font-size:12.5px;color:var(--ink-faint)}

.flag{border-left:4px solid;border-radius:0 9px 9px 0;padding:15px 17px;margin-bottom:13px}
.flag.warn{background:var(--warn-soft);border-color:var(--warn)}
.flag.danger{background:var(--danger-soft);border-color:var(--danger)}
.flag.ok{background:var(--ok-soft);border-color:var(--ok)}
.flag .ft{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:6px}
.flag.warn .ft{color:var(--warn)} .flag.danger .ft{color:var(--danger)} .flag.ok .ft{color:var(--ok)}
.flag p{font-size:14.5px}

button{font-family:inherit;font-size:15px;border:none;border-radius:10px;cursor:pointer;color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:15px;width:100%;font-size:16px}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.sm{width:auto;padding:10px 15px;font-size:14px}
.linkbtn{display:block;width:100%;background:none;color:var(--ink-faint);font-size:13px;
  padding:12px;text-decoration:underline;text-underline-offset:3px}
input,select{
  background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);
  border-radius:9px;padding:12px;font:inherit;width:100%
}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row{display:flex;gap:9px;align-items:center}
.grow{flex:1;min-width:0}

/* --- hero giorno --- */
.hero{
  background:var(--accent);color:var(--accent-ink);border-radius:14px;
  padding:18px;margin-bottom:14px
}
.hero .hl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero .hb{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:27px;line-height:1.08;margin:4px 0 5px}
.hero .hs{font-size:14px;opacity:.92}

.bar{height:7px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin:6px 0 7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .25s}

/* --- esercizio --- */
.exname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:23px;line-height:1.15;margin-bottom:7px}
.exdose{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--ink-soft);margin-bottom:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.05em;padding:4px 9px;border-radius:3px
}
.chip.hip{background:var(--hip-soft);color:var(--hip)}
.chip.knee{background:var(--knee-soft);color:var(--knee)}
.chip.sp0{background:var(--ok-soft);color:var(--ok)}
.chip.sp1{background:var(--warn-soft);color:var(--warn)}
.chip.core{background:var(--surface-2);color:var(--ink-soft)}

.peso{margin-bottom:15px;color:var(--ink-soft);font-size:14px}
.peso b{font-family:"Bricolage Grotesque",sans-serif;font-size:42px;font-weight:800;
  color:var(--accent);line-height:1;letter-spacing:-.03em;display:inline-block;margin-right:3px}
.ask{font-weight:700;font-size:15.5px;margin-bottom:10px}

.sets{display:flex;flex-direction:column;gap:9px;margin-bottom:4px}
.set{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--surface-2);border:1px solid var(--line-strong);
  padding:17px 15px;border-radius:12px
}
.set .n{font-weight:700;font-size:15.5px;flex:0 0 auto}
.set .v{flex:1;color:var(--ink-faint);font-size:12.5px}
.set .k{font-size:19px;color:var(--ink-faint);flex:0 0 auto;line-height:1}
.set.on{background:var(--ok-soft);border-color:var(--ok)}
.set.on .v{color:var(--ok);font-weight:700;font-size:13.5px;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.set.on .k{color:var(--ok)}

.setrow{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.setrow .sl{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-faint);flex:0 0 18px}
.setrow input{text-align:center;padding:10px 6px}
.setrow .u{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);flex:0 0 auto}

.note{
  background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:11px 13px;font-size:14px;color:var(--ink-soft);margin-top:14px;line-height:1.5
}

/* --- timer --- */
.timer{
  position:fixed;left:14px;right:14px;bottom:88px;max-width:632px;margin:0 auto;z-index:30;
  background:var(--accent);color:var(--accent-ink);border-radius:13px;padding:13px 16px;
  display:none;align-items:center;justify-content:space-between;
  box-shadow:0 10px 30px rgba(0,0,0,.28)
}
.timer.on{display:flex}
.timer .tt{font-family:"IBM Plex Mono",monospace;font-size:25px;font-weight:600;font-variant-numeric:tabular-nums}
.timer .tn{font-size:13px;opacity:.85;font-weight:600}
.timer button{background:rgba(0,0,0,.2);color:var(--accent-ink);padding:9px 14px;font-weight:700;font-size:13px}

/* --- nav --- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
.nav button{
  flex:1;background:none;color:var(--ink-faint);border-radius:0;
  padding:11px 2px 13px;font-size:10.5px;font-weight:700;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:5px
}
.nav button .ic{
  width:19px;height:19px;border-radius:50%;border:2.5px solid currentColor;
  display:block;transition:background .15s
}
.nav button.on{color:var(--accent)}
.nav button.on .ic{background:var(--accent);border-color:var(--accent)}

/* --- segmenti --- */
.seg{display:flex;gap:6px;margin-bottom:15px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  padding:11px 12px;font-weight:700;font-size:14px;white-space:nowrap
}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* --- liste scheda --- */
.exrow{padding:14px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:none}
.exrt{display:flex;gap:11px;align-items:baseline}
.exrn{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-faint);flex:0 0 18px}
.exrname{font-weight:700;flex:1;font-size:16px;line-height:1.3}
.exrd{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.exrc{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0 29px}

/* --- macro --- */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 5px;text-align:center}
.kpi b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:800;line-height:1.1}
.kpi span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-faint);
  letter-spacing:.09em;text-transform:uppercase;font-weight:600}

.meal{border-left:3px solid var(--accent);padding-left:13px;margin-bottom:16px}
.meal .mn{font-weight:700;font-size:15.5px;margin-bottom:3px}
.meal .mi{font-size:14.5px;color:var(--ink-soft)}
.meal .mm{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--accent);
  font-weight:600;margin-top:5px;letter-spacing:.03em}

table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);text-align:left;
  padding:0 10px 8px 0;border-bottom:1px solid var(--line-strong)}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}

ul{margin:0;padding-left:0;list-style:none}
li{position:relative;padding-left:20px;margin-bottom:9px;font-size:15px;line-height:1.5}
li:last-child{margin-bottom:0}
li::before{content:"";position:absolute;left:3px;top:9px;width:6px;height:6px;
  border-radius:50%;background:var(--accent)}
li.no::before{content:"×";background:none;left:1px;top:-2px;width:auto;height:auto;
  color:var(--danger);font-weight:700;font-size:17px}

h2.sec{font-size:21px;font-weight:800;margin:26px 0 4px}
h2.sec:first-child{margin-top:0}
.secnote{color:var(--ink-soft);font-size:14.5px;margin-bottom:14px}
h3.ttl{font-size:17px;font-weight:600;margin-bottom:7px}

/* --- interruttore semplice/completo --- */
.modo{display:flex;gap:5px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:4px;margin-bottom:14px}
.modo button{flex:1;background:none;color:var(--ink-soft);padding:10px;font-weight:700;font-size:14px}
.modo button.on{background:var(--accent);color:var(--accent-ink)}

/* --- vista completa --- */
.exc{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  margin-bottom:10px;overflow:hidden}
.exc.fatto{border-color:var(--ok)}
.exc-h{display:flex;gap:11px;padding:14px;align-items:flex-start;cursor:pointer}
.exc-n{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--surface-2);
  color:var(--ink-faint);display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;margin-top:2px}
.exc.fatto .exc-n{background:var(--ok);color:var(--paper)}
.exc-t{font-weight:700;font-size:16px;line-height:1.3;margin-bottom:4px}
.exc-m{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-faint)}
.exc-b{padding:0 14px 14px;border-top:1px solid var(--line);padding-top:13px}
.chk{width:40px;flex:0 0 40px;height:42px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line-strong);color:var(--ink-faint);font-size:16px}
.chk.on{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.prec{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--accent);
  font-weight:600;margin-bottom:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="hd"><h1 id="hdT">Oggi</h1><div class="sub" id="hdS"></div></div>
<div class="wrap" id="app"></div>

<div class="timer" id="tm">
  <span class="tt" id="tmT">1:30</span>
  <span class="tn" id="tmN">Riposo</span>
  <button onclick="stopTimer()">Salta</button>
</div>

<div class="nav" id="nav"></div>

<script>
/* ============================ DATI ============================ */
var SCHEDA = {
  A:{nome:"Glutei pesante + braccia", sub:"Il giorno che conta di più", durata:"~70 min", ex:[
    {id:"a1",n:"Hip thrust con bilanciere",s:4,r:"8-10",rec:"2-3 min",t:"hip",sp:0,inc:5,
     note:"L'esercizio più importante del piano. Mento verso il petto, spingi con i talloni, in alto stringi il sedere per un secondo pieno. Non inarcare la schiena per salire più su: se serve inarcarsi, il peso è troppo."},
    {id:"a2",n:"Stacco rumeno con manubri",s:3,r:"10-12",rec:"2 min",t:"hip",sp:1,inc:2.5,
     note:"Le prime tre settimane leggerissimo, conta solo il movimento. Sedere indietro, manubri che sfiorano la coscia, scendi finché senti tirare dietro la gamba e fermati lì. Se tira la schiena invece dei femorali il movimento è sbagliato: torna al pull-through finché non viene."},
    {id:"a3",n:"Affondo all'indietro con manubri",s:3,r:"10 per gamba",rec:"90 s",t:"hip",sp:0,inc:2,
     note:"All'indietro e non in avanti: sposta il lavoro dal ginocchio al gluteo e non dà fastidio alle ginocchia. Busto leggermente inclinato in avanti."},
    {id:"a4",n:"Abduzione anca alla macchina",s:4,r:"15-20",rec:"60 s",t:"hip",sp:0,inc:2.5,
     note:"Gluteo medio, la parte alta e laterale: è quella che dà la forma tonda vista di dietro. Busto inclinato in AVANTI sulla macchina, non all'indietro."},
    {id:"a5",n:"Leg curl sdraiata",s:3,r:"12-15",rec:"90 s",t:"knee",sp:0,inc:2.5,
     note:"Lavora dietro la gamba. Il femorale dà la linea senza ingrossare come il quadricipite, e insieme al gluteo tende la pelle nella zona dove la cellulite si vede di più."},
    {id:"a6",n:"Curl con manubri",s:3,r:"10-12",rec:"75 s",t:"arm",sp:0,inc:1,
     note:"Bicipiti. Gomiti fermi attaccati ai fianchi, si muove solo l'avambraccio. Fermata di un secondo in basso, dove il muscolo è allungato."},
    {id:"a7",n:"Push down alla corda",s:3,r:"12-15",rec:"60 s",t:"arm",sp:0,inc:2.5,
     note:"Tricipiti, la parte dietro del braccio: è quella che le donne vogliono tonica e che nessuno allena. Gomiti fermi, si aprono solo gli avambracci."},
    {id:"a8",n:"Dead bug",s:3,r:"8 per lato",rec:"60 s",t:"core",sp:0,inc:0,
     note:"Schiena schiacciata contro il pavimento per tutto l'esercizio: se si stacca, hai già perso. È questo, non i crunch, che raddrizza il bacino e appiattisce la pancia."},
    {id:"a9",n:"Plank laterale",s:3,r:"20-30 sec per lato",rec:"45 s",t:"core",sp:0,inc:0,
     note:"Addominali obliqui, quelli che disegnano i fianchi."}
  ]},
  B:{nome:"Parte alta completa", sub:"Dorso, petto, spalle e la schiena", durata:"~70 min", ex:[
    {id:"b1",n:"Lat machine presa neutra",s:4,r:"10-12",rec:"2 min",t:"back",sp:0,inc:2.5,
     note:"Dà larghezza alla schiena vista di dietro, e una schiena più larga fa sembrare la vita più stretta. Mai dietro il collo."},
    {id:"b2",n:"Panca inclinata 30° con manubri",s:3,r:"10-12",rec:"2 min",t:"chest",sp:0,inc:2,
     note:"Petto. Serve a equilibrare la parte alta e alla postura. Onestà: il pettorale sta SOTTO il seno, che è grasso e ghiandola — allenarlo non alza il seno e non lo rimpicciolisce. Si fa per la forma delle spalle e del torace, non per altro."},
    {id:"b3",n:"Rematore con un manubrio",s:3,r:"10-12 per braccio",rec:"90 s",t:"back",sp:0,inc:2,
     note:"Con la mano appoggiata alla panca la colonna non prende carico. Tira verso l'anca, non verso la spalla."},
    {id:"b4",n:"Military press con manubri, seduta",s:3,r:"10-12",rec:"90 s",t:"back",sp:0,inc:2,
     note:"Spalle. Presa neutra, gomiti davanti al corpo, non scendere sotto il mento. Mai dietro la testa."},
    {id:"b5",n:"Iperestensioni a 45° (back extension)",s:3,r:"12-15",rec:"90 s",t:"hip",sp:1,inc:2.5,
     note:"Il pezzo che cura la schiena, ed è già un esercizio per i glutei. Schiena alta leggermente arrotondata, sali fino alla linea del corpo e NON oltre, stringendo il sedere. Senza peso per le prime 4 settimane. Lento, mai di slancio."},
    {id:"b6",n:"Alzate laterali",s:3,r:"15-20",rec:"60 s",t:"back",sp:0,inc:1,
     note:"Spalle più rotonde e un po' più larghe: è l'esercizio che più di tutti fa sembrare la vita stretta."},
    {id:"b7",n:"Face pull",s:3,r:"15-20",rec:"60 s",t:"back",sp:0,inc:1,
     note:"Postura e spalla posteriore. Leggero e pulito, mai a strappi. Puoi farlo subito dopo le alzate senza riposare."},
    {id:"b8",n:"Pallof press",s:3,r:"12 per lato",rec:"60 s",t:"core",sp:0,inc:2.5,
     note:"Il cavo tira di lato e tu resti dritta. Insegna al core a non far ruotare la colonna: quello che serve quando ti giri con uno scatolone in braccio."},
    {id:"b9",n:"Camminata con un peso da un lato",s:3,r:"30 metri",rec:"90 s",t:"core",sp:0,inc:2,
     note:"Un manubrio pesante in una mano sola, cammini dritta senza inclinarti. È il gesto della borsa della spesa: allenarlo è ciò che fa smettere di far male al lavoro."}
  ]},

/* La settimana avanza con gli allenamenti fatti, non col calendario:
   ogni 3 giorni di allenamento completati = settimana successiva.
   Un giorno conta se almeno meta' degli esercizi di quella scheda sono segnati. */
function allenamentiFatti(){
  var perData={};
  Object.keys(S.done||{}).forEach(function(k){
    if(!S.done[k])return;
    var p=k.split("|"); (perData[p[1]]=perData[p[1]]||{})[p[0]]=true;
  });
  var n=0;
  Object.keys(perData).forEach(function(d){
    ["A","B","C"].forEach(function(g){
      var ex=SCHEDA[g].ex, c=0;
      ex.forEach(function(e){if(perData[d][e.id])c++;});
      if(c>=Math.ceil(ex.length/2))n++;
    });
  });
  return n+(S.extraSedute||0);
}
function settimana(){return Math.max(1,Math.floor(allenamentiFatti()/3)+1);}
function nellaSettimana(){return allenamentiFatti()%3;}
function fase(){
  var w=settimana();
  for(var i=0;i<SCALING.length;i++){if(w>=SCALING[i].w[0]&&w<=SCALING[i].w[1])return SCALING[i];}
  var c=(w-10)%9;
  return c===8?SCALING[3]:{w:[w,w],p:100,l:"Pieno regime",d:SCALING[2].d};
}
function serieScalate(n){return Math.max(1,Math.round(n*fase().p/100));}

var tmI=null,tmS=0;
function startTimer(sec,nome){
  clearInterval(tmI); tmS=sec; $("#tmN").textContent=nome||"Riposo";
  $("#tm").classList.add("on"); dipingi();
  tmI=setInterval(function(){tmS--;dipingi();if(tmS<=0){stopTimer();bip();}},1000);
  function dipingi(){
    var m=Math.floor(tmS/60),s=tmS%60;
    $("#tmT").textContent=m+":"+String(s).padStart(2,"0");
  }

function recSec(r){
  var m=String(r).match(/(\d+)\s*-?\s*\d*\s*min/);
  if(m)return parseInt(m[1])*60;
  var s=String(r).match(/(\d+)\s*s/);
  return s?parseInt(s[1]):90;
}
function bip(){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    var a=new C(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=880;
    g.gain.setValueAtTime(.25,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.01,a.currentTime+.5);
    o.start();o.stop(a.currentTime+.5);
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
}

function trovaPeso(log){
  for(var i=0;i<log.length;i++){if(log[i]&&log[i].w!=null&&log[i].w!=="")return log[i].w;}
  return null;
}
function primoNum(r){var m=String(r).match(/(\d+)/);return m?+m[1]:10;}
function intervallo(r){
  var m=String(r).match(/(\d+)\s*-\s*(\d+)/);
  if(m)return{min:+m[1],max:+m[2]};
  var s=String(r).match(/(\d+)/);
  return s?{min:+s[1],max:+s[1]}:{min:8,max:12};
}
function sessionePrec(id){
  var ks=Object.keys(S.logs).filter(function(k){
    return k.indexOf(id+"|")===0&&k!==chiave(id);}).sort().reverse();
  for(var i=0;i<ks.length;i++){
    var set=S.logs[ks[i]].filter(function(s){return s&&s.w&&s.r;});
    if(set.length)return{d:ks[i].split("|")[1],set:set};
  }
  return null;
}
function suggerimento(ex){
  if(ex.inc===0)return null;
  var p=sessionePrec(ex.id); if(!p)return null;
  var r=intervallo(ex.r);
  var w=Math.max.apply(null,p.set.map(function(s){return parseFloat(s.w)||0;}));
  var alPeso=p.set.filter(function(s){return parseFloat(s.w)===w;});
  var rips=alPeso.map(function(s){return parseInt(s.r)||0;});
  var minR=Math.min.apply(null,rips);
  var medR=rips.reduce(function(a,b){return a+b;},0)/rips.length;
  if(minR>=r.max)return{w:+(w+ex.inc).toFixed(1),r:r.min,tipo:"su"};
  if(medR<r.min-1)return{w:+(w*0.9).toFixed(1),r:r.min,tipo:"giu"};
  return{w:w,r:Math.min(r.max,Math.max.apply(null,rips)+1),tipo:"pari"};
}

function impostaPeso(id){
  var el=document.getElementById("p-"+id); if(!el||!el.value)return;
  var k=chiave(id); S.logs[k]=S.logs[k]||[];

function tocca(id,j,w,r,rec){
  var k=chiave(id); S.logs[k]=S.logs[k]||[];
  var s=S.logs[k][j]||{};
  if(s.ok){S.logs[k][j]=Object.assign({},s,{ok:false});salva();render();return;}
  S.logs[k][j]={w:String(w),r:String(s.r!=null?s.r:r),ok:true};
  salva(); startTimer(recSec(rec),"Riposo"); render();
}
function segna(id,i,f,v){
  var k=chiave(id); S.logs[k]=S.logs[k]||[]; S.logs[k][i]=S.logs[k][i]||{};
  S.logs[k][i][f]=v; salva();

    '<div class="card">'+
    '<p class="muted">La cellulite non è grasso normale ed è per questo che non si comporta come il grasso normale. Sotto la pelle ci sono dei tiranti fibrosi che la ancorano in profondità: quando le cellule di grasso fra un tirante e l\'altro si gonfiano, spingono la pelle in fuori mentre i tiranti la tengono giù. Da lì l\'aspetto a buccia d\'arancia. Nelle donne quei tiranti sono disposti in verticale, negli uomini a rete: è il motivo per cui riguarda <b>l\'80-90% delle donne</b>, comprese quelle magre e comprese le atlete.</p>'+
    '<p class="muted" style="margin-bottom:0"><b>Cosa la migliora davvero, in modo modesto:</b> meno grasso sottocutaneo, e soprattutto più muscolo sotto la pelle, che riempie e tende la superficie. Gluteo e femorali più pieni cambiano l\'aspetto della zona più di qualunque altra cosa. È esattamente quello che fa questo piano — ma il risultato è un miglioramento, non una sparizione, e arriva in mesi.</p></div>'+
    '<div class="flag danger"><span class="ft">Cosa invece non funziona</span>'+
    '<p style="margin:0">Creme, fanghi, bendaggi, drenanti, integratori "anticellulite", massaggi e i cosiddetti esercizi mirati: nessuno di questi ha mostrato un effetto reale in uno studio serio. Se un prodotto promette di toglierla, ti sta vendendo qualcosa. Non spendere soldi lì: spendili in cibo buono e in un paio di scarpe comode per camminare.</p></div>';

  h+='<h2 class="sec">Quanto si parte piano</h2>'+
    '<p class="secnote">I muscoli tornano in fretta dopo due anni di stop, tendini e articolazioni no. Con una schiena che già dà fastidio il margine è ancora più stretto.</p>'+
    '<div class="card"><div class="tablewrap"><table><thead><tr><th>Settimane</th><th>Serie</th><th>Come</th></tr></thead><tbody>';
  SCALING.forEach(function(f){
    h+='<tr><td class="num">'+(f.w[0]===f.w[1]?f.w[0]:f.w[0]+"-"+f.w[1])+'</td>'+
      '<td class="num">'+(f.p===50?"metà":f.p===66?"2/3":"tutte")+'</td>'+
      '<td class="muted">'+esc(f.d)+'</td></tr>';
  });
  h+='</tbody></table></div>'+
    '<div class="note" style="margin-top:14px"><b>La regola del carico.</b> Quando chiudi tutte le serie al numero alto di ripetizioni con la tecnica pulita, la volta dopo metti più peso e riparti dal numero basso. L\'app te lo dice da sola. Se il carico è fermo da tre settimane, di solito si dorme poco o si mangia poco.</div></div>';

  h+='<h2 class="sec">Cosa non fare</h2>'+
    '<p class="secnote">Non sono esercizi cattivi: lavorano contro questi obiettivi precisi.</p><div class="card"><ul>';
  VIETATI.forEach(function(v){h+='<li class="no"><b>'+esc(v.n)+'</b> — '+esc(v.p)+'</li>';});
  return h+'</ul></div>';
}

/* ============================ CIBO ============================ */
function vCibo(){
  var h='<div class="kpi">'+
    '<div><b>'+TARGET.kcal+'</b><span>kcal</span></div>'+
    '<div><b>'+TARGET.p+'</b><span>prot</span></div>'+
    '<div><b>'+TARGET.c+'</b><span>carbo</span></div>'+
    '<div><b>'+TARGET.f+'</b><span>grassi</span></div></div>';

  h+='<div class="flag ok"><span class="ft">Perché questi numeri</span>'+
    '<p>A 52 kg, 165 cm, 22 anni, in piedi al lavoro e con tre allenamenti a settimana, il tuo mantenimento è intorno alle <b>'+MANTENIMENTO+' kcal</b>. Per far crescere il gluteo serve stare sopra: '+TARGET.kcal+' kcal, cioè circa 200 in più.</p>'+
    '<p style="margin:0">È un surplus piccolo di proposito. Mangiare molto di più non fa crescere il muscolo più in fretta — fa solo aggiungere grasso che poi va tolto.</p></div>';

  h+='<h2 class="sec">La giornata tipo</h2>'+
    '<p class="secnote">Non è una gabbia: è un esempio che centra i numeri. Cambia i cibi come vuoi, tenendo le proteine di ogni pasto.</p><div class="card">';
  PASTI.forEach(function(p){
    h+='<div class="meal"><div class="mn">'+esc(p.n)+'</div>'+
      '<div class="mi">'+esc(p.i)+'</div>'+
      '<div class="mm">'+esc(p.m)+'</div></div>';
  });
  h+='</div>';

  h+='<h2 class="sec">Le quattro regole</h2><div class="card"><ul>'+
    CIBO_REGOLE.map(function(r){return '<li>'+esc(r)+'</li>';}).join("")+'</ul></div>';

  h+='<div class="flag warn"><span class="ft">Un esame del sangue che vale la pena fare</span>'+
    '<p style="margin:0">Nelle ragazze di 22 anni che si allenano la <b>ferritina bassa</b> è molto comune, e dà esattamente i sintomi che si confondono con lo scarso allenamento: fiato corto, stanchezza, carichi che non salgono. Vale la pena chiedere al medico emocromo, ferritina, vitamina D e tiroide prima di partire. Non è un allarme, è un controllo che evita di sbattere la testa per mesi.</p></div>';

  h+='<h2 class="sec">Cosa aspettarsi</h2><div class="card"><div class="tablewrap"><table><tbody>';
  ASPETTATIVE.forEach(function(a){
    h+='<tr><td class="num" style="width:110px">'+esc(a.q)+'</td><td class="muted">'+esc(a.c)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  h+='<div class="flag warn"><span class="ft">Sul ritmo, senza illusioni</span>'+
    '<p style="margin:0">Una donna che si allena bene e mangia bene mette circa <b>0,2-0,3 kg di muscolo al mese</b>, e i primi mesi un po\' di più perché è recupero di quello che avevi già. Significa che il gluteo cambia davvero in <b>4-6 mesi</b>, non in sei settimane. Chi promette di più sta vendendo qualcosa.</p></div>';
  return h;
}

/* ============================ PROGRESSI ============================ */
function vProg(){
  var p=S.misure.slice().sort(function(a,b){return a.d.localeCompare(b.d);});
  var ult=p[p.length-1], primo=p[0];
  var h='';

  if(ult){
    var dg=primo&&p.length>1?(ult.g-primo.g):0;
    var dv=primo&&p.length>1?(ult.v-primo.v):0;
    var dk=primo&&p.length>1?(ult.kg-primo.kg):0;
    h+='<div class="kpi" style="grid-template-columns:repeat(3,1fr)">'+
      '<div><b>'+ult.kg+'</b><span>kg</span></div>'+
      '<div><b>'+ult.g+'</b><span>sedere cm</span></div>'+
      '<div><b>'+ult.v+'</b><span>vita cm</span></div></div>';
    if(p.length>1){
      h+='<div class="flag '+(dg>0?"ok":"warn")+'"><span class="ft">Dal primo giorno</span>'+
        '<p style="margin:0">Sedere <b>'+(dg>=0?"+":"")+dg.toFixed(1)+' cm</b> · '+
        'vita <b>'+(dv>=0?"+":"")+dv.toFixed(1)+' cm</b> · '+
        'peso <b>'+(dk>=0?"+":"")+dk.toFixed(1)+' kg</b>.<br>'+
        'La differenza fra sedere e vita è <b>'+(ult.g-ult.v).toFixed(1)+' cm</b>: è questo il numero che conta, non il peso.</p></div>';
    }
  }

  h+='<div class="card"><div class="lbl">Nuova misurazione</div>'+
    '<p class="muted" style="margin-bottom:13px">Ogni 4 settimane, la mattina a digiuno. Il sedere nel punto più largo, la vita all\'ombelico.</p>'+
    '<div class="row" style="margin-bottom:9px">'+
    '<input id="m-kg" type="number" inputmode="decimal" step="0.1" placeholder="peso kg">'+
    '<input id="m-g" type="number" inputmode="decimal" step="0.5" placeholder="sedere cm"></div>'+
    '<div class="row" style="margin-bottom:11px">'+
    '<input id="m-v" type="number" inputmode="decimal" step="0.5" placeholder="vita cm">'+
    '<button class="btn sm" style="padding:12px 18px" onclick="salvaMisura()">Salva</button></div>'+
    '<div class="tiny">Fai anche le foto: di fronte, di lato e di spalle, stessa luce e stessa posa. Sono l\'unica prova onesta.</div></div>';

  if(p.length){
    h+='<h2 class="sec">Storico</h2><div class="card"><div class="tablewrap"><table>'+
      '<thead><tr><th>Data</th><th>Peso</th><th>Sedere</th><th>Vita</th><th>Diff.</th></tr></thead><tbody>';
    p.slice().reverse().forEach(function(x){
      h+='<tr><td class="num">'+dataIT(x.d)+'</td><td class="num">'+x.kg+'</td>'+
        '<td class="num">'+x.g+'</td><td class="num">'+x.v+'</td>'+
        '<td class="num" style="color:var(--accent)">'+(x.g-x.v).toFixed(1)+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  h+='<h2 class="sec">Carichi</h2>';
  var storia=[];
  Object.keys(SCHEDA).forEach(function(g){
    SCHEDA[g].ex.forEach(function(e){
      if(e.inc===0)return;
      var pr=sessionePrec(e.id)||(S.logs[chiave(e.id)]&&S.logs[chiave(e.id)].filter(function(s){return s&&s.w;}).length?
        {d:oggiISO(),set:S.logs[chiave(e.id)].filter(function(s){return s&&s.w;})}:null);
      if(pr){
        var w=Math.max.apply(null,pr.set.map(function(s){return parseFloat(s.w)||0;}));
        storia.push({n:e.n,w:w,d:pr.d});
      }
    });
  });
  if(storia.length){
    h+='<div class="card"><div class="tablewrap"><table>'+
      '<thead><tr><th>Esercizio</th><th>Ultimo carico</th><th>Quando</th></tr></thead><tbody>';
    storia.forEach(function(x){
      h+='<tr><td>'+esc(x.n)+'</td><td class="num">'+x.w+' kg</td><td class="num muted">'+dataIT(x.d)+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  } else {
    h+='<div class="card"><p class="muted" style="margin:0">Qui compariranno i carichi man mano che segni le serie nella scheda Oggi.</p></div>';
  }

  h+='<div class="flag ok"><span class="ft">Il numero da guardare</span>'+
    '<p style="margin:0">Non la bilancia: costruendo muscolo il peso sale mentre l\'aspetto migliora. Guarda la <b>differenza fra sedere e vita</b> e i <b>carichi che salgono</b>. Se quei due numeri crescono, sta funzionando, qualunque cosa dica la bilancia.</p></div>';

  h+='<div class="card"><h3>Salvataggio online</h3>'+
    '<p class="muted">'+(SY.sola?'Stai guardando la scheda in <b>sola lettura</b>: le modifiche non vengono salvate online.':'I dati si salvano online da soli, così non si perdono se cambi telefono.')+'</p>'+
    '<div class="muted" style="margin-bottom:10px">Stato: <b id="syncSt">'+esc(syncStato||"...")+'</b></div>'+
    (SY.sola?'':'<button class="btn sec sm" style="margin-bottom:8px" onclick="copia(linkPer(false))">Copia link da mandare (solo lettura)</button>'+
    '<button class="btn sec sm" style="margin-bottom:8px" onclick="copia(linkPer(true))">Copia link per un altro telefono suo</button>')+
    '<details><summary class="muted">Codice e collegamento manuale</summary>'+
    '<div class="muted" style="margin:8px 0;word-break:break-all">Codice: <b>'+esc(SY.codice)+'</b></div>'+
    '<input id="cod-in" placeholder="Incolla un codice o un link">'+
    '<button class="btn sec sm" style="margin-top:8px" onclick="collega()">Collega</button></details></div>';
  h+='<div class="card"><h3>Settimana</h3>'+
    '<p class="muted">Avanza da sola ogni 3 allenamenti completati. Se hai fatto allenamenti senza segnarli, correggi qui.</p>'+
    '<div class="row" style="gap:8px"><button class="btn sec sm" onclick="spostaSett(-1)">− 1 settimana</button>'+
    '<b style="flex:1;text-align:center">Settimana '+settimana()+'</b>'+
    '<button class="btn sec sm" onclick="spostaSett(1)">+ 1 settimana</button></div></div>';
  h+='<button class="linkbtn" onclick="azzera()">Cancella tutti i dati salvati</button>';
  return h;
}

function salvaMisura(){
  var kg=parseFloat(document.getElementById("m-kg").value);
  var g=parseFloat(document.getElementById("m-g").value);
  var v=parseFloat(document.getElementById("m-v").value);
  if(!kg||!g||!v)return;
  S.misure.push({d:oggiISO(),kg:kg,g:g,v:v});
  salva(); render();
}
function spostaSett(n){
  S.extraSedute=Math.max(-allenamentiFatti()+(S.extraSedute||0),(S.extraSedute||0)+n*3);
  salva(); render();
}
function azzera(){
  if(!confirm("Cancello tutto: serie segnate, carichi e misure. Sicura?"))return;
  S={start:oggiISO(),idx:0,logs:{},done:{},pesi:[],misure:[]};
  salva(); render();
}

/* ============================ AVVIO ============================ */
render();
scarica();
</script>

</body>
</html>
